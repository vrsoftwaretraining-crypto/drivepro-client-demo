name: Build and deploy DrivePro client demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter web platform exists
        run: |
          if [ ! -d web ]; then
            flutter create . --platforms=web
          fi

      - name: Install packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build database-free demo website
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release \
            --base-href "/${REPOSITORY_NAME}/" \
            --dart-define=DEMO_MODE=true
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish demo website
        id: deployment
        uses: actions/deploy-pages@v4
